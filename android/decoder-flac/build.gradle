plugins { id 'com.android.library' }

android {
    namespace 'androidx.media3.decoder.flac'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        minSdk 25
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake {
                arguments '-DWITH_OGG=OFF', '-DBUILD_SHARED_LIBS=OFF', '-DBUILD_CXXLIBS=OFF',
                    '-DBUILD_PROGRAMS=OFF', '-DBUILD_EXAMPLES=OFF', '-DBUILD_TESTING=OFF',
                    '-DBUILD_DOCS=OFF', '-DINSTALL_MANPAGES=OFF'
                targets 'flacJNI'
            }
        }
    }
    externalNativeBuild {
        cmake { path 'src/main/jni/CMakeLists.txt'; version '3.22.1' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.6.0'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
}
