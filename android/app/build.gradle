plugins { id 'com.android.application' }

def signing = new Properties()
def signingFile = rootProject.file('local-signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'cn.yuusei.m3x'
    compileSdk 35
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'cn.yuusei.m3x'
        minSdk 25
        targetSdk 28
        versionCode 6
        versionName '0.5.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }
    buildTypes {
        release { minifyEnabled false }
    }
    if (signingFile.exists()) {
        signingConfigs {
            localRelease {
                storeFile rootProject.file(signing.getProperty('storeFile'))
                storePassword signing.getProperty('storePassword')
                keyAlias signing.getProperty('keyAlias')
                keyPassword signing.getProperty('keyPassword')
            }
        }
        buildTypes.release.signingConfig = signingConfigs.localRelease
    }
    testOptions { unitTests.returnDefaultValues = true }
    // This is a sideload build for M3X, not a Google Play submission.
    lint { disable 'ExpiredTargetSdkVersion' }
}

dependencies {
    implementation project(':decoder-flac')
    def ffmpegDecoder = rootProject.file('.tools/media3-decoder-ffmpeg.aar')
    if (!ffmpegDecoder.isFile()) throw new GradleException('Run prepare-ffmpeg.ps1 before building.')
    implementation files(ffmpegDecoder)
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.5.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'net.jthink:jaudiotagger:3.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
